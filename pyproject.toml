[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "studydesk"
dynamic = ["version"]
description = "A local-first workspace for reading research papers: PDF reader, highlights, notes, search and a history of your reading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Subham Divakar" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["pdf", "research", "papers", "reader", "notes", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/shubham10divakar/studydesk"
Source = "https://github.com/shubham10divakar/studydesk"
Issues = "https://github.com/shubham10divakar/studydesk/issues"
Roadmap = "https://github.com/shubham10divakar/studydesk/blob/main/docs/roadmap.md"

[project.scripts]
studydesk = "studydesk.cli:main"

[tool.hatch.version]
path = "studydesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["studydesk"]

# The browser app stays in prototype/ (no build step there); the wheel carries a copy as studydesk/static/.
[tool.hatch.build.targets.wheel.force-include]
"prototype" = "studydesk/static"

[tool.hatch.build.targets.sdist]
include = ["studydesk", "prototype", "README.md", "LICENSE", "pyproject.toml"]
